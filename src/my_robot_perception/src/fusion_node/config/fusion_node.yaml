fusion_node:
  ros__parameters:
    frames:
      lidar_frame: os_lidar
      base_frame: base_link

    topics:
      lidar_detections: /lidar/detections3d

    # Multi-camera configuration: each camera has its own frame, topics, etc.
    cameras:
      front:
        frame: zed_left_camera_optical_frame
        detections2d: /camera/detections2d
        camera_info: /zed/zed_node/left/camera_info
        camera_image: /zed/zed_node/left/image_rect_color
      rear:
        frame: zed_rear_left_camera_optical_frame
        detections2d: /camera_rear/detections2d
        camera_info: /zed_rear/zed_node/left/camera_info
        camera_image: /zed_rear/zed_node/left/image_rect_color

    outputs:
      fused_enriched_clusters: /fusion/enriched_clusters
      fused_markers: /fusion/markers
      fused_debug_image: /fusion/debug_image

    sync:
      queue_size: 15
      max_time_difference_ms: 500

    association:
      min_iou_threshold: 0.15

    visualization:
      publish_debug_image: true
      min_depth_m: 0.5
      max_depth_m: 30.0
