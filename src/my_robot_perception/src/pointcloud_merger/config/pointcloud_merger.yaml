pointcloud_merger_node:
  ros__parameters:
    output_frame: os_sensor
    output_topic: /merged/points

    # LiDAR source (passthrough, already in os_sensor frame)
    lidar_topic: /ouster/points
    lidar_enabled: true

    # ZED front stereo depth cloud
    camera_front_topic: /zed/zed_node/point_cloud/cloud_registered
    camera_front_enabled: true
    camera_front_voxel_leaf_m: 0.05

    # ZED 2i rear stereo depth cloud
    camera_rear_topic: /zed_rear/zed_node/point_cloud/cloud_registered
    camera_rear_enabled: true
    camera_rear_voxel_leaf_m: 0.05

    # Max age before a source cloud is considered stale (seconds)
    # Set generous to tolerate Jetson CPU load slowing ZED depth publish
    max_stale_sec: 3.0

    # Publish rate (Hz) — matches LiDAR scan rate
    rate_hz: 10.0
